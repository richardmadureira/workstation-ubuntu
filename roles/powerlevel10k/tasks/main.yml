- name: Verificar se Powerlevel10k já está instalado
  stat:
    path: "{{ home_dir }}/.oh-my-zsh/custom/themes/powerlevel10k"
  register: p10k_dir

- name: Instalar Powerlevel10k
  git:
    repo: https://github.com/romkatv/powerlevel10k.git
    dest: "{{ home_dir }}/.oh-my-zsh/custom/themes/powerlevel10k"
    depth: 1
  when: not p10k_dir.stat.exists

- name: Configurar tema Powerlevel10k no .zshrc
  lineinfile:
    path: "{{ home_dir }}/.zshrc"
    regexp: '^ZSH_THEME='
    line: 'ZSH_THEME="powerlevel10k/powerlevel10k"'

- name: Copiar configuração do Powerlevel10k
  copy:
    src: .p10k.zsh
    dest: "{{ home_dir }}/.p10k.zsh"