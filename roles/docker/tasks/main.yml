- name: Instalar dependências do Docker
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
  become: true

- name: Criar diretório para chaves APT
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Adicionar chave GPG do Docker
  shell: curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg
  become: true

- name: Adicionar repositório Docker
  # descomentar essa linha quando o docker possuir o repositorio oficial (quando lançar o beta do ubuntu 26.04)
  #shell: echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  shell: echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu noble stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  args:
    creates: /etc/apt/sources.list.d/docker.list
  become: true

- name: Instalar Docker CE
  become: true
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Habilitar serviço Docker
  become: true
  systemd:
    name: docker
    enabled: true
    state: started

- name: Adicionar usuário ao grupo docker
  become: true
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes